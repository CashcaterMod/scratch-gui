name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # FIX: do NOT use npm ci in Scratch forks
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build scratch-gui
        run: npm run build
        env:
          NODE_ENV: production
          ROUTING_STYLE: hash

      - name: Replace green flag assets (post-build patch)
        run: |
          curl -L https://cattymod.app/assets/green-flag.svg -o /tmp/green-flag.svg

          find ./build -type f -name "green-flag*.svg" -exec cp /tmp/green-flag.svg {} \;

          rm /tmp/green-flag.svg

      - name: Fix artifact permissions
        run: chmod -R +rwx ./build/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./build/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
